<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1c2b4a" />
    <meta name="description" content="A deadlock-free 2D Mesopotamian puzzle-platformer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Inanna: Seven Gates</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;

      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game" data-testid="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
