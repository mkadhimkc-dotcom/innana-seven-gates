name: CI

# SPEC 50: every routine PR must pass tests, the validator, the bots and the
# e2e smoke test. Routine branches get the same feedback before review that
# they would get after merge.
on:
  push:
    branches:
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# Cancel superseded runs on pull request branches only. Never on a push: LANE
# step 10 certifies a card against the Actions run for its own merge commit on
# develop, so every develop commit has to keep its own run. Cancelling those
# leaves commits with no conclusion and nothing to certify against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first: a type error fails in seconds, not minutes.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prove every level deadlock-free (SPEC 18-19)
        run: npm run validate

      - name: Adversarial bot playtests (SPEC 48)
        run: npm run bots

      - name: Build
        run: npm run build

      - name: Check bundle size against the SPEC 31 budget
        run: |
          BYTES=$(find dist -type f ! -name '*.map' -printf '%s\n' | awk '{total += $1} END {print total}')
          LIMIT=$((5 * 1024 * 1024))
          echo "Bundle: $BYTES bytes (budget $LIMIT)"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::Bundle is over the 5 MB uncompressed budget (SPEC 31)."
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Gameplay smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
