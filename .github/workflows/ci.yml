name: CI

# SPEC 50: every routine PR must pass tests, the validator, the bots and the
# e2e smoke test. Routine branches get the same feedback before review that
# they would get after merge.
on:
  push:
    branches:
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first: a type error fails in seconds, not minutes.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prove every level deadlock-free (SPEC 18-19)
        run: npm run validate

      - name: Adversarial bot playtests (SPEC 48)
        run: npm run bots

      - name: Build
        run: npm run build

      - name: Check bundle size against the SPEC 31 budget
        run: |
          BYTES=$(find dist -type f ! -name '*.map' -printf '%s\n' | awk '{total += $1} END {print total}')
          LIMIT=$((5 * 1024 * 1024))
          echo "Bundle: $BYTES bytes (budget $LIMIT)"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::Bundle is over the 5 MB uncompressed budget (SPEC 31)."
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Gameplay smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # F-04: the human connects a free Cloudflare account once and adds
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets (see
      # docs/deploy-cloudflare.md). Until then this job no-ops instead of
      # failing, so develop's CI stays green.
      - name: Check Cloudflare secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets are not set (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Skipping deploy — see docs/deploy-cloudflare.md."
          fi

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      # Rebuilds from the exact commit the test and e2e jobs already proved
      # green (SPEC 51: build must pass validation before it's live).
      - name: Build
        if: steps.check.outputs.configured == 'true'
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: steps.check.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: inanna-seven-gates
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
